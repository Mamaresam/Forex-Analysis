<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <main class="main">
            <!-- Top minimal bar -->
            <div class="top-bar">
                <div class="pair-selector">
                    <select id="pairSelect">
                        <option value="EURUSD">EUR/USD</option>
                        <option value="GBPUSD">GBP/USD</option>
                        <option value="USDJPY">USD/JPY</option>
                        <option value="XAUUSD">XAU/USD</option>
                        <option value="BTCUSD">BTC/USD</option>
                    </select>
                </div>
                <button class="btn-icon" id="refreshBtn" title="Refresh">↻</button>
            </div>

            <!-- Stacked Price Cards -->
            <section class="stack-section">
                <div class="stack-wrapper" id="stackWrapper">
                    <!-- Cards will be injected by JS -->
                </div>
                <div class="stack-dots" id="stackDots"></div>
            </section>

            <!-- Chart + Side Info -->
            <section class="content-grid">
                <div class="card chart-card">
                    <div class="card-header">
                        <h3>Live Chart</h3>
                        <div class="timeframes">
                            <button class="tf active" data-interval="60">1H</button>
                            <button class="tf" data-interval="240">4H</button>
                            <button class="tf" data-interval="D">1D</button>
                            <button class="tf" data-interval="W">1W</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div id="tradingview_chart"></div>
                    </div>
                </div>

                <div class="side-panels">
                    <div class="card info-card">
                        <h4>Market Overview</h4>
                        <div class="info-row">
                            <span>USD Strength</span>
                            <span class="up">Strong</span>
                        </div>
                        <div class="info-row">
                            <span>Volatility</span>
                            <span>Medium</span>
                        </div>
                        <div class="info-row">
                            <span>Sentiment</span>
                            <span class="down">Fear</span>
                        </div>
                    </div>

                    <div class="card info-card">
                        <h4>Top Movers</h4>
                        <div class="hot-pair">
                            <span>GBP/JPY</span>
                            <span class="up">+0.42%</span>
                        </div>
                        <div class="hot-pair">
                            <span>XAU/USD</span>
                            <span class="up">+0.34%</span>
                        </div>
                        <div class="hot-pair">
                            <span>EUR/GBP</span>
                            <span class="down">-0.21%</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="script.js"></script>
</body>
</html>
