<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark">
    <div class="app">
        <main class="main">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="theme-btn" id="themeBtn" title="Toggle Theme">☾</button>
                <div class="pair-selector">
                    <select id="pairSelect">
                        <option value="EURUSD">EUR/USD</option>
                        <option value="GBPUSD">GBP/USD</option>
                        <option value="USDJPY">USD/JPY</option>
                        <option value="XAUUSD" selected>XAU/USD</option>
                        <option value="BTCUSD">BTC/USD</option>
                    </select>
                </div>
                <button class="btn-icon" id="refreshBtn" title="Refresh">↻</button>
            </div>

            <!-- Stacked Price Cards -->
            <section class="stack-section">
                <div class="stack-wrapper" id="stackWrapper"></div>
                <div class="stack-dots" id="stackDots"></div>
            </section>

            <!-- Chart -->
            <section class="chart-section">
                <div class="card chart-card">
                    <div class="card-header">
                        <h3>Live Chart</h3>
                        <div class="timeframes">
                            <button class="tf active" data-interval="60">1H</button>
                            <button class="tf" data-interval="240">4H</button>
                            <button class="tf" data-interval="D">1D</button>
                            <button class="tf" data-interval="W">1W</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div id="tradingview_chart"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="script.js"></script>
</body>
</html>
